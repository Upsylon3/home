version: 2

updates:
  # --- JS/Node side: homecore + every app under apps/ + packages/homecore-client ---
  # This is ONE entry pointing at the repo root, not one per workspace. npm
  # workspaces share a single root package-lock.json — pointing Dependabot at
  # individual workspace folders instead (e.g. /apps/homecloud-backend) is a
  # known-broken pattern: it edits that folder's package.json but not the
  # root lockfile, leaving you with an install that doesn't match what's
  # committed. Root-level config understands the "workspaces" field in the
  # root package.json and correctly updates every workspace + the one
  # lockfile together, in a single coherent PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps are batched into one low-drama PR per week.
      # Majors (express 4->5-style changes) are deliberately excluded from
      # the group so each lands as its own PR you'll actually want to read
      # the changelog for before merging.
      routine-updates:
        update-types: ["minor", "patch"]
    ignore:
      # Keep future better-sqlite3 MAJOR bumps blocked. HOME deliberately
      # moved from 11.10.0 to 12.11.1 for Node 26: 12.11.1 has a Node 26
      # prebuild and retains the prebuild-install flow used by the existing
      # lockfile. The earlier v13 experiment was reverted because npm ci
      # against the committed lockfile attempted a source build on Windows.
      # Revisit v13+ only as a separate migration with the Windows prebuild
      # install check in CI; minor/patch updates within v12 remain enabled.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]

  # --- Android app (apps/homesync-android) ---
  # Covers the Gradle plugin versions (AGP, Kotlin, KSP, the Compose
  # Compiler plugin) declared in build.gradle.kts, plus every androidx/
  # Retrofit/OkHttp/etc. library version in app/build.gradle.kts.
  - package-ecosystem: "gradle"
    directory: "/apps/homesync-android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # The Kotlin compiler classpath, Compose compiler plugin and KSP have
    # to move together: the Compose plugin must match the Kotlin version
    # exactly (see apps/homesync-android/build.gradle.kts), and KSP must
    # support that Kotlin version. Dependabot otherwise opens one PR per
    # plugin, and merging one alone leaves the build mismatched until the
    # others land (which happened with Kotlin 2.4.20 and the Compose plugin).
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"
    ignore:
      # These majors can't be taken one PR at a time, because each depends
      # on the others being moved with it. A single Dependabot PR would
      # leave the build half-migrated, so do them together, by hand:
      #  - Future AGP/Gradle majors need a coordinated compatibility pass.
      #    AGP 9's built-in Kotlin migration is complete; keep AGP 10 and
      #    Gradle 10 blocked until deliberately assessed together.
      #  - Retrofit and OkHttp majors must match each other: the Gson
      #    converter and the logging interceptor have to be the same
      #    generation as the Retrofit/OkHttp core they sit on.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      # API-37 AndroidX restrictions were lifted after the AGP 9.1.1 /
      # compileSdk 37 migration. Future library updates still need Android CI.

  # --- Dockerfiles: homecore + every app under apps/ (node:26-slim, and
  # nginx:1.31-alpine for the 7 frontends) ---
  # Docker doesn't have workspace-wide dependency resolution the way npm
  # does, so this still opens one PR per directory per image bump — the
  # directories list here just avoids repeating this whole block 15 times.
  - package-ecosystem: "docker"
    directories:
      - "/homecore"
      - "/apps/home"
      - "/apps/homecloud"
      - "/apps/homecloud-backend"
      - "/apps/homemedia"
      - "/apps/homemedia-backend"
      - "/apps/homenotes"
      - "/apps/homenotes-backend"
      - "/apps/hometasks"
      - "/apps/homemonitor"
      - "/apps/homemonitor-backend"
      - "/apps/homesync-backend"
      - "/apps/hometasks-backend"
      - "/apps/homevault"
      - "/apps/homevault-backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      # Never offer a Node MAJOR bump. Dependabot proposes whatever the
      # newest tag is, which is not the same as "the version to run":
      # odd-numbered Node releases (25, 27) never become LTS and reach
      # end-of-life within months (25 already has, on 2026-06-01). It also
      # opens one PR per Dockerfile, so the 15 Node-based images would drift
      # onto different Node versions while CI and docs/DEVELOPMENT.md still
      # use the previous baseline. Move all 15 Dockerfiles, every workflow
      # node-version and the docs in ONE deliberate change (roadmap item 9).
      # Minor/patch updates within the pinned Node major still arrive normally.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- Dockerfiles with their own, different base images ---
  - package-ecosystem: "docker"
    directories:
      - "/gateway"
      - "/services/backup"
    schedule:
      interval: "monthly"

  # --- GitHub Actions: the versions pinned in .github/workflows/*.yml ---
  # Without this, the workflows that check every Dependabot PR would
  # quietly fall behind on their own actions/checkout, actions/setup-node
  # etc. and nobody would be told.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

# To have PRs auto-assigned to you, add e.g.:
#   reviewers:
#     - "your-github-username"
# under any of the blocks above.
