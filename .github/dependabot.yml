version: 2

updates:
  # --- JS/Node side: homecore + every app under apps/ + packages/homecore-client ---
  # This is ONE entry pointing at the repo root, not one per workspace. npm
  # workspaces share a single root package-lock.json — pointing Dependabot at
  # individual workspace folders instead (e.g. /apps/homecloud-backend) is a
  # known-broken pattern: it edits that folder's package.json but not the
  # root lockfile, leaving you with an install that doesn't match what's
  # committed. Root-level config understands the "workspaces" field in the
  # root package.json and correctly updates every workspace + the one
  # lockfile together, in a single coherent PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps are batched into one low-drama PR per week.
      # Majors (express 4->5-style changes) are deliberately excluded from
      # the group so each lands as its own PR you'll actually want to read
      # the changelog for before merging.
      routine-updates:
        update-types: ["minor", "patch"]
    ignore:
      # Never offer a better-sqlite3 MAJOR bump. 13 was tried in 1.1.4 and
      # reverted: a plain `npm install` against the committed lockfile
      # tried to compile it from source, which needs a C++ toolchain most
      # Windows dev machines don't have (see CHANGELOG.md [1.1.4]).
      # Minor/patch bumps still arrive normally. Remove this rule when
      # that install problem is understood.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]

  # --- Android app (apps/homesync-android) ---
  # Covers the Gradle plugin versions (AGP, Kotlin, KSP, the Compose
  # Compiler plugin) declared in build.gradle.kts, plus every androidx/
  # Retrofit/OkHttp/etc. library version in app/build.gradle.kts.
  - package-ecosystem: "gradle"
    directory: "/apps/homesync-android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # The Kotlin compiler plugin, the Compose compiler plugin and KSP have
    # to move together: the Compose plugin must match the Kotlin version
    # exactly (see apps/homesync-android/build.gradle.kts), and KSP must
    # support that Kotlin version. Dependabot otherwise opens one PR per
    # plugin, and merging one alone leaves the build mismatched until the
    # others land (which happened with Kotlin 2.4.20 and the Compose plugin).
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"
    ignore:
      # These majors can't be taken one PR at a time, because each depends
      # on the others being moved with it. A single Dependabot PR would
      # leave the build half-migrated, so do them together, by hand:
      #  - Android Gradle Plugin 9 and Gradle 9 go as a pair, and AGP 9
      #    bundles its own Kotlin support, which conflicts with the
      #    separately-applied Kotlin plugin here (CHANGELOG.md [1.1.4]).
      #  - Retrofit and OkHttp majors must match each other: the Gson
      #    converter and the logging interceptor have to be the same
      #    generation as the Retrofit/OkHttp core they sit on.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      # Newer AndroidX Compose/Navigation/Lifecycle releases require
      # Android Gradle Plugin 9.1+ and compileSdk 37, and this project is
      # held on AGP 8.13 (see apps/homesync-android/build.gradle.kts), which
      # caps at compileSdk 36. A PR for any of these fails the build with
      # "requires Android Gradle plugin 9.1.0 or higher" (seen on the
      # Compose BOM 2026.09.00 PR). So only patch updates are offered, until
      # the AGP 9 migration (docs/ROADMAP.md item 11) is done deliberately.
      # If another AndroidX PR fails with that same message, add it here.
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.navigation:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.lifecycle:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # core-ktx is different: 1.19.0 is where it starts requiring AGP 9.1 /
      # compileSdk 37, but earlier releases are fine, so block only that
      # line and keep accepting 1.14 to 1.18.x. (Reported by other projects
      # on AGP 8; it has not been tried on this one, so if a 1.18.x PR
      # fails the build the same way, tighten this.)
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]

  # --- Dockerfiles: homecore + every app under apps/ (node:22-slim, and
  # nginx:1.30-alpine for the 5 frontends) ---
  # Docker doesn't have workspace-wide dependency resolution the way npm
  # does, so this still opens one PR per directory per image bump — the
  # directories list here just avoids repeating this whole block 11 times.
  - package-ecosystem: "docker"
    directories:
      - "/homecore"
      - "/apps/home"
      - "/apps/homecloud"
      - "/apps/homecloud-backend"
      - "/apps/homemedia"
      - "/apps/homemedia-backend"
      - "/apps/homenotes"
      - "/apps/homenotes-backend"
      - "/apps/homesync-backend"
      - "/apps/hometasks-backend"
      - "/apps/homevault"
      - "/apps/homevault-backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      # Never offer a Node MAJOR bump. Dependabot proposes whatever the
      # newest tag is, which is not the same as "the version to run":
      # odd-numbered Node releases (25, 27) never become LTS and reach
      # end-of-life within months (25 already has, on 2026-06-01). It also
      # opens one PR per Dockerfile, so the 11 services would drift onto
      # different Node versions while CI and docs/DEVELOPMENT.md still say
      # 22. Move all 11 Dockerfiles, ci.yml's node-version and the docs
      # in ONE deliberate change instead (docs/ROADMAP.md item 9).
      # Minor/patch updates of the pinned major still arrive normally.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- Dockerfiles with their own, different base images ---
  - package-ecosystem: "docker"
    directories:
      - "/gateway"
      - "/services/backup"
    schedule:
      interval: "monthly"

  # --- GitHub Actions: the versions pinned in .github/workflows/*.yml ---
  # Without this, the workflows that check every Dependabot PR would
  # quietly fall behind on their own actions/checkout, actions/setup-node
  # etc. and nobody would be told.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

# To have PRs auto-assigned to you, add e.g.:
#   reviewers:
#     - "your-github-username"
# under any of the blocks above.
