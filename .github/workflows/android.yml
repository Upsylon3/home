# Android CI compiles the debug APK and runs JVM tests.
# Emulator journeys remain available in source for explicit device testing;
# CI never installs or starts an emulator.

name: Android

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 0'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select Android checks
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m unittest discover -s scripts/test -p 'test_ci_*.py'
          python3 scripts/ci-scope.py
  build:
    name: Build debug APK and run unit tests
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/homesync-android
    steps:
      - uses: actions/checkout@v7

      # AGP 9.1.1 and Gradle 9.3.1 both support JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The repo has gradle/wrapper/gradle-wrapper.properties but NOT the
      # `gradlew` script or wrapper jar (Android Studio generates them), so
      # `./gradlew` doesn't exist in a fresh checkout. This installs Gradle
      # directly instead. Read the committed version so a wrapper update
      # cannot get a green build using an older hardcoded CI distribution.
      - name: Test Android CI helpers
        working-directory: .
        run: python3 -m unittest discover -s scripts/test -p 'test_android_*.py'

      - name: Read committed Gradle version
        id: gradle
        run: python3 ../../scripts/android-gradle-version.py >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      # GitHub's runner image already ships the Android SDK. AGP downloads
      # any missing piece itself, but only once the SDK licences are
      # accepted, which is what this does (the "|| true" is because `yes`
      # gets a broken-pipe error when sdkmanager stops reading).
      - name: Accept Android SDK licences
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Runner images need not include this stable platform yet.
      - name: Install Android build SDK
        working-directory: .
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      # assembleDebug     = compile everything and package a debug APK.
      #                     This is the step that failed in 1.1.4 (AAPT
      #                     could not link the Material theme).
      # testDebugUnitTest = the JUnit tests (SyncLogicTest.kt, which covers
      #                     the hashing/dedup logic).
      - name: Build and test
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest

      # Keeps the APK for 14 days so you can download it from the run's page.
      # Debug-signed, contains no secrets, not suitable for publishing.
      - name: Save the debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: homesync-debug-apk
          path: apps/homesync-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Compile migration fixtures here; execute them only on an explicitly
      # provisioned disposable emulator/device, never implicitly in CI.
      - name: Save the instrumentation APK and Room schemas
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: homesync-migration-fixtures
          path: |
            apps/homesync-android/app/build/outputs/apk/androidTest/debug/*.apk
            apps/homesync-android/app/schemas/
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify migration SQL against the generated Room contract
        run: |
          node --test test/destination-migration.test.mjs
          git diff --exit-code -- app/schemas

      # If the build failed, keep the HTML test/lint reports for debugging.
      - name: Save reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: apps/homesync-android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
