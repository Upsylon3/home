# Continuous integration: runs on GitHub's machines, not yours, every time
# code is pushed to main or a pull request is opened/updated.
#
# WHY THIS FILE EXISTS
# Dependabot (see .github/dependabot.yml) opens pull requests that bump
# dependencies and Docker base images. Before this file, nothing checked
# whether a bump broke anything, so every PR needed a manual "checkout,
# npm ci, npm test" by hand. Now each PR shows a green tick or a red cross
# and you only have to read the ones that matter.
#
# Five independent jobs, so one failure never hides another:
#   test    - all automated tests + a production build of every frontend
#   audit   - `npm audit`, kept separate so a NEW advisory doesn't turn the
#             tests red (a new advisory isn't the PR's fault, but you still
#             want to see it)
#   gateway - runs gateway/nginx.conf in a REAL nginx against fake apps that
#             come and go (gateway/test/gateway-smoke.sh), no Docker needed
#   docker  - builds every image and boots the whole stack, then pokes it
#             through the gateway. It verifies the complete topology and app
#             recovery described in docs/ROADMAP.md item 6.
#
# The Android build lives in its own file (android.yml) because it is slow
# and only matters when apps/homesync-android changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab, for re-running by hand.
  workflow_dispatch:

# If you push twice in a row, stop the older run instead of wasting minutes
# on code that is already out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only need to READ the repo. (Dependabot PRs
# get a read-only token anyway, so asking for more would just fail there.)
permissions:
  contents: read

jobs:
  test:
    name: Tests and frontend builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must match the Dockerfiles (node:26-slim) and docs/DEVELOPMENT.md.
          # Node 26 is the ecosystem's current Active LTS runtime.
          node-version: 26
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what
      # package-lock.json says and fails if the lockfile and package.json
      # disagree. That is the same rule the Dockerfiles follow, and it is
      # what catches a Dependabot PR that edited one but not the other.
      - run: npm ci

      # Runs every workspace's own test suite (362 tests at time of writing).
      - run: npm test

      # Exercise the real backup script, including archive restore and
      # injected create/verify/publish/prune failures, in temporary paths.
      - run: npm run test:backup

      # The tests don't compile the React code, so a broken import in a
      # .jsx file would pass them. Building each frontend catches that.
      # --if-present skips workspaces (the backends) with no build script.
      - run: npm run build --workspaces --if-present

  windows:
    name: Windows install and native SQLite smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # This is deliberately a real Windows npm ci against the committed
      # lockfile. It protects the exact install path that failed with the
      # earlier better-sqlite3 v13 experiment. Fail unless the Node 26
      # Windows prebuild is used; falling back to Visual Studio compilation
      # would hide the regression for ordinary Windows developers.
      - name: Install the committed lockfile and capture lifecycle output
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "npm-ci.log"
          npm ci --foreground-scripts --loglevel=info 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -Pattern "prebuild-install info install Successfully installed prebuilt binary" -Quiet)) {
            throw "better-sqlite3 did not confirm installation of its Node 26 Windows prebuilt binary. Do not accept a source-build fallback."
          }

      - name: Exercise the native SQLite binding
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.exec('CREATE TABLE smoke (value TEXT)'); db.prepare('INSERT INTO smoke VALUES (?)').run('node26-windows'); const row = db.prepare('SELECT value FROM smoke').get(); if (row.value !== 'node26-windows') throw new Error('SQLite round-trip failed'); db.close(); console.log('better-sqlite3 works on ' + process.version + ' / ' + process.platform + ' / ' + process.arch);"

  # The gateway is the one container that publishes a port, and a mistake in
  # its config is invisible to every other test. This runs the real file in a
  # real nginx with fake apps that start and stop (see the script's header), so
  # "one app is down" is checked on every push without needing Docker.
  gateway:
    name: Gateway config (real nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx-light
      - name: Test the gateway
        run: bash gateway/test/gateway-smoke.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Fail only on HIGH or CRITICAL. Low/moderate advisories in
      # dev-only tooling would otherwise make every PR red for reasons
      # unrelated to the change; they still show up when you run
      # `npm audit` yourself.
      - run: npm audit --audit-level=high

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml reads ./homecore/.env, which is git-ignored (it
      # holds secrets), so a fresh checkout doesn't have one. Create it from
      # the example file with throwaway random secrets. These exist only for
      # this run on a machine GitHub deletes afterwards.
      - name: Create throwaway .env with random secrets
        run: |
          cp homecore/.env.example homecore/.env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" homecore/.env
          sed -i "s|^HOMECORE_INTERNAL_SECRET=.*|HOMECORE_INTERNAL_SECRET=$(openssl rand -hex 32)|" homecore/.env

      # Builds all 17 images. This is the first real test of the base-image
      # bumps (node:26-slim, nginx:1.31-alpine, alpine:3.24).
      - name: Build every image
        run: docker compose build

      # --wait blocks until every service with a healthcheck reports
      # healthy, and fails if one never does.
      - name: Start the whole stack
        run: docker compose up -d --wait --wait-timeout 180

      # Everything below goes through the gateway on :8080, exactly like a
      # browser would, so it also proves the nginx routing table is right.
      - name: Smoke test through the gateway
        run: |
          set -eu
          BASE=http://localhost:8080

          echo "--- every frontend is served"
          for path in / /cloud/ /media/ /notes/ /vault/ /tasks/ /monitor/; do
            curl -fsS -o /dev/null "$BASE$path"
            echo "ok  $path"
          done

          echo "--- every backend answers its health check"
          for path in /api/health \
                      /api/homecloud/health /api/homemedia/health \
                      /api/homenotes/health /api/homesync/health \
                      /api/homevault/health \
                      /api/hometasks/health /api/homemonitor/health; do
            curl -fsS -o /dev/null "$BASE$path"
            echo "ok  $path"
          done

          echo "--- a protected route refuses a request with no token"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/homecloud/files")
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }
          echo "ok  401 without a token"

          echo "--- register the first account (it becomes admin)"
          resp=$(curl -fsS -X POST "$BASE/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-password-123"}')
          token=$(echo "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          [ -n "$token" ] || { echo "no token in response"; exit 1; }
          echo "ok  registered"

          echo "--- that token works on a DIFFERENT service"
          # homecloud-backend has no user database of its own. It has to
          # ask HomeCore whether this token is valid, using the shared
          # HOMECORE_INTERNAL_SECRET. A 200 here proves that whole chain
          # (gateway -> homecloud-backend -> homecore) is wired up.
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" "$BASE/api/homecloud/files"
          echo "ok  cross-service auth"

          printf 'backup restore smoke\n' > /tmp/backup-smoke.txt
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -F 'file=@/tmp/backup-smoke.txt' "$BASE/api/homecloud/files/upload"

      - name: Restore-check live SQLite backups from read-only volumes
        run: |
          set -eu
          # Separate output prevents collisions with the automatic startup
          # cycle. All sources retain their production read-only mounts.
          docker compose stop backup
          docker compose run --rm -e BACKUP_DIR=/backups/ci-restore-check backup --once
          docker compose run --rm -T --entrypoint python3 \
            -v "$PWD/services/backup/test/compose-restore.py:/compose-restore.py:ro" \
            backup /compose-restore.py

      # docs/ROADMAP.md item 10: one stopped app must not take the gateway, or
      # any other app, down. HomeTasks is stopped on purpose (frontend and
      # backend), the rest is checked, then it is started again and must be
      # found WITHOUT restarting the gateway.
      - name: One stopped app does not take the gateway down
        run: |
          set -eu
          BASE=http://localhost:8080
          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }

          docker compose stop hometasks hometasks-backend

          [ "$(status $BASE/)" = "200" ] || { echo "Home should still load"; exit 1; }
          echo "ok  Home still loads"
          [ "$(status $BASE/tasks/)" = "503" ] || { echo "/tasks/ should answer 503"; exit 1; }
          curl -s "$BASE/tasks/" | grep -q "HomeTasks is offline" || { echo "no offline page"; exit 1; }
          echo "ok  the stopped app's page says it is offline"
          [ "$(status $BASE/api/hometasks/health)" = "503" ] || { echo "API should answer 503"; exit 1; }
          curl -s "$BASE/api/hometasks/health" | grep -q "HomeTasks is offline" || { echo "no offline JSON"; exit 1; }
          echo "ok  the stopped app's API says it is offline"
          curl -fsS -o /dev/null "$BASE/api/homecloud/health"
          curl -fsS -o /dev/null "$BASE/cloud/"
          echo "ok  other apps are unaffected"

          docker compose start hometasks-backend hometasks
          # The app has to boot, and the gateway re-checks names every 10 s.
          for i in $(seq 1 45); do
            [ "$(status $BASE/api/hometasks/health)" = "200" ] && [ "$(status $BASE/tasks/)" = "200" ] && break
            sleep 2
          done
          [ "$(status $BASE/api/hometasks/health)" = "200" ] || { echo "HomeTasks API never came back"; exit 1; }
          [ "$(status $BASE/tasks/)" = "200" ] || { echo "HomeTasks page never came back"; exit 1; }
          echo "ok  found again once it started"

          restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q gateway)")
          [ "$restarts" = "0" ] || { echo "the gateway restarted $restarts times"; exit 1; }
          echo "ok  the gateway never restarted"

      # Only runs if something above failed. Shows each container's output
      # so you can see WHY, instead of just "step failed".
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80

      # Always clean up, even on failure.
      - name: Stop the stack
        if: always()
        run: docker compose down -v
