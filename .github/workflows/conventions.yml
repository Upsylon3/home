name: Repository conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Commit, PR and branch conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate pull-request branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: node scripts/check-commit-message.mjs --branch "$BRANCH_NAME"

      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-message.mjs --message "$PR_TITLE"

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.mjs --range "$BASE_SHA..$HEAD_SHA"

      - name: Validate commits pushed to main
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            node scripts/check-commit-message.mjs --range "HEAD~1..$HEAD_SHA"
          else
            node scripts/check-commit-message.mjs --range "$BEFORE_SHA..$HEAD_SHA"
          fi
