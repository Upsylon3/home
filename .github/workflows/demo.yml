name: Browser demo
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'
permissions:
  contents: read
concurrency:
  group: browser-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Select demo checks
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.scope.outputs.demo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-scope.py
  verify:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.demo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_BASE: /${{ github.event.repository.name }}/
      DEMO_BROWSER_CHANNEL: chrome
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test/demo-artifact.test.mjs
      - run: npm run test:demo
      - run: npm run build:demo
      - run: npm run test:demo:browser
      - name: Verify standalone Vault benchmark against production CSP without backends
        run: |
          npm run build --workspace=apps/homevault
          node apps/homevault/test-support/benchmark-browser.mjs
      - run: node scripts/demo-artifact.mjs package
      - uses: actions/upload-artifact@v7
        with:
          name: home-browser-demo-${{ github.run_attempt }}
          path: demo-artifact
          retention-days: 14
          include-hidden-files: true
