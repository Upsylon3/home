name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to validate and publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Validate annotated tag, main ancestry and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag" || {
            echo "Release tags must be annotated Git tags." >&2
            exit 1
          }
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main || {
            echo "The release tag must point to a commit reachable from main." >&2
            exit 1
          }
          node scripts/validate-release.mjs "$RELEASE_TAG" . > "$RUNNER_TEMP/release-notes.md"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          CI_RUNS="$(gh run list --workflow ci.yml --branch main --commit "$RELEASE_SHA" --json status,conclusion,createdAt --limit 20)"
          node -e 'const runs=JSON.parse(process.argv[1]); const latest=runs[0]; if (!latest || latest.status !== "completed" || latest.conclusion !== "success") { console.error("The latest full CI run (including Docker) for this exact main commit must have succeeded before release."); process.exit(1); }' "$CI_RUNS"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Run all workspace tests
        run: npm test

      - name: Build every frontend
        run: npm run build --workspaces --if-present

      - name: Install nginx for the gateway smoke test
        run: sudo apt-get update && sudo apt-get install -y nginx-light

      - name: Test the gateway configuration
        run: bash gateway/test/gateway-smoke.sh

  prepare:
    name: Prepare a draft release
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: node scripts/validate-release.mjs "$RELEASE_TAG" . > release-notes.md
      - run: node server/publish.mjs prepare

  downloads:
    name: Build ${{ matrix.arch }} server downloads
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test server/test/setup.test.mjs server/test/package.test.mjs
      - name: Build runtime images and OS archives
        run: node server/build.mjs
      - name: Boot the packaged topology and prove account/file persistence
        run: node server/smoke.mjs server-dist/home-server
      # Release assets avoid metered Actions artifact storage for large image bundles.
      - name: Upload this architecture to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node server/publish.mjs upload

  publish:
    name: Publish validated server downloads
    needs: [validate, downloads]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: node server/publish.mjs finalize
