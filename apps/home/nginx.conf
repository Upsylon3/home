server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Home is the entrance hall: it must load even when HomeCloud, or anything
    # else, is down (docs/ARCHITECTURE.md, principle 4). A plain
    # `proxy_pass http://homecloud-backend:4500` is looked up ONCE when nginx
    # starts, and nginx refuses to start if that container isn't running, so
    # Home itself would crash-loop whenever HomeCloud's backend was missing.
    # Putting the address in a variable makes nginx look it up per request,
    # through Docker's DNS, exactly as the gateway does (gateway/nginx.conf).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # In the real deployed topology (see gateway/nginx.conf) the gateway
    # intercepts every /api/... request before it ever reaches this
    # container — only the gateway publishes a host port, this one only
    # `expose`s internally (docker-compose.yml). These rules exist as a
    # defense-in-depth fallback (and so this file accurately describes
    # the real routing, not a stale one) in case this container is ever
    # reached directly, mirroring the gateway's own routing exactly.

    # Home's dashboard shows a HomeCloud quota widget (api.js's
    # homecloudQuota()) — needs its own rule since that's a different
    # service from everything else below.
    location /api/homecloud/ {
        set $up http://homecloud-backend:4500;
        proxy_pass $up;  # no path given, so the request path is passed on unchanged
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Home's optional search client talks only to the Tier 2 service.
    location /api/homebridge/ {
        set $up http://homebridge:4900;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else — identity, admin, the application registry — goes
    # to HomeCore.
    location /api/ {
        set $up http://homecore:4000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
