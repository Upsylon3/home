server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # In the real deployed topology (see gateway/nginx.conf) the gateway
    # intercepts every /api/... request before it ever reaches this
    # container — only the gateway publishes a host port, this one only
    # `expose`s internally (docker-compose.yml). These rules exist as a
    # defense-in-depth fallback (and so this file accurately describes
    # the real routing, not a stale one) in case this container is ever
    # reached directly, mirroring the gateway's own routing exactly.

    # Home's dashboard shows a HomeCloud quota widget (api.js's
    # homecloudQuota()) — needs its own rule since that's a different
    # service from everything else below.
    location /api/homecloud/ {
        proxy_pass http://homecloud-backend:4500/api/homecloud/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else — identity, admin, the application registry — goes
    # to HomeCore.
    location /api/ {
        proxy_pass http://homecore:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
