server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads to pass through to the backend.
    client_max_body_size 1024m;

    # Proxy API calls to the backend container (see docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # Never cache the service worker file itself, so browsers pick up
    # updates to it right away instead of running a stale version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React Router: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
