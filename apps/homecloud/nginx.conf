server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads to pass through.
    client_max_body_size 1024m;

    # In the real deployed topology (see gateway/nginx.conf) the gateway
    # intercepts every /api/... request before it ever reaches this
    # container — only the gateway publishes a host port, this one only
    # `expose`s internally (docker-compose.yml). These rules exist as a
    # defense-in-depth fallback (and so this file accurately describes
    # the real routing, not a stale one) in case this container is ever
    # reached directly, mirroring the gateway's own routing exactly.

    # This frontend's own core functionality (upload/list/download/share)
    # lives on apps/homecloud-backend, a separate service from HomeCore
    # as of v0.9.0 — see MIGRATION_PLAN.md.
    location /api/homecloud/ {
        proxy_pass http://homecloud-backend:4500/api/homecloud/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # Public share-link downloads — deliberately unprefixed and
    # unauthenticated, same service as above (see
    # apps/homecloud-backend/src/publicShare.js).
    location /api/share/ {
        proxy_pass http://homecloud-backend:4500/api/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # Everything else — auth, admin, activity — goes to HomeCore.
    location /api/ {
        proxy_pass http://homecore:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # Never cache the service worker file itself, so browsers pick up
    # updates to it right away instead of running a stale version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React Router: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
