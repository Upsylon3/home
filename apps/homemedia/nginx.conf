server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # More specific location first: HomeMedia's own API goes to its own
    # backend. Everything else under /api (auth, files, folders, core) goes
    # to the shared HomeCloud/HomeCore backend, since HomeMedia has no
    # identity or storage of its own — see homemedia-backend/src/homecloudClient.js.
    location /api/homemedia/ {
        proxy_pass http://homemedia-backend:4200/api/homemedia/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
