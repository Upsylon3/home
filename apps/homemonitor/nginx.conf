server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # In the real setup (see gateway/nginx.conf) the gateway answers every
    # /api/... request before it reaches this container. These two rules are
    # a safety net that mirror the gateway: HomeMonitor's own API goes to its
    # backend, everything else under /api (login) goes to HomeCore.
    location /api/homemonitor/ {
        proxy_pass http://homemonitor-backend:4800/api/homemonitor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://homecore:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: serve index.html for any route that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
