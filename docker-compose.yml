# `name:` pins the Docker Compose "project name" to a fixed value.
#
# Without this, Compose derives the project name from whatever folder this
# file happens to sit in — and every named volume below (homecore_data,
# homemedia_data, ...) is actually stored internally as
# "<project-name>_<volume-name>". Re-extracting a copy of this repo into a
# folder with a different name would silently create BRAND NEW, EMPTY
# volumes instead of reusing your real data — this pin is what makes "the
# same volume every time" actually true. Do not change this value once you
# have real data in a running deployment; changing it has the same effect
# as renaming the folder.
name: home

services:
  # ---------------------------------------------------------------------
  # Tier 0 — infrastructure every app depends on.
  # ---------------------------------------------------------------------

  gateway:
    build: ./gateway
    restart: unless-stopped
    # The gateway must wait for EVERY container it forwards to, not just
    # homecore. nginx looks up each upstream's hostname once, at startup,
    # and refuses to start ("host not found in upstream") if any of them
    # isn't running yet. With only homecore listed here, the gateway raced
    # ahead of the other services and crash-looped until they appeared.
    # Backends have healthchecks, so wait until they're healthy. The
    # frontends have none, so "started" is the strongest thing to wait for.
    # (A gateway that survives a missing app would be better — see
    # docs/ROADMAP.md item 10.)
    depends_on:
      homecore: { condition: service_healthy }
      homecloud-backend: { condition: service_healthy }
      homemedia-backend: { condition: service_healthy }
      homenotes-backend: { condition: service_healthy }
      homesync-backend: { condition: service_healthy }
      hometasks-backend: { condition: service_healthy }
      homevault-backend: { condition: service_healthy }
      home: { condition: service_started }
      homecloud: { condition: service_started }
      homemedia: { condition: service_started }
      homenotes: { condition: service_started }
      hometasks: { condition: service_started }
      homevault: { condition: service_started }
    ports: ["8080:80"] # the ONLY container that publishes a host port

  homecore:
    build: { context: ., dockerfile: homecore/Dockerfile }
    restart: unless-stopped
    env_file: [./homecore/.env]
    environment:
      DATA_DIR: /data
      HOMECLOUD_FRONTEND_URL: /cloud/
      HOMEMEDIA_FRONTEND_URL: /media/
      HOMESYNC_INFO_URL: /sync/
      HOMENOTES_FRONTEND_URL: /notes/
      HOMEVAULT_FRONTEND_URL: /vault/
      # Used for the admin panel's storage-usage lookup (homecore/src/admin.js).
      # No depends_on needed for this one: the fetch has its own short
      # timeout and a fallback if homecloud-backend isn't reachable yet, so
      # homecore doesn't need to wait for it at startup.
      HOMECLOUD_BACKEND_INTERNAL_URL: http://homecloud-backend:4500
    volumes: [homecore_data:/data]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------
  # Tier 1 — independent applications. Each owns its own database/volume
  # and process; none of them may reach into another app's database.
  # ---------------------------------------------------------------------

  home:
    build: { context: ., dockerfile: apps/home/Dockerfile }
    restart: unless-stopped
    depends_on: { homecore: { condition: service_healthy } }
    expose: ["80"]

  homecloud:
    build: { context: ., dockerfile: apps/homecloud/Dockerfile }
    restart: unless-stopped
    depends_on: { homecloud-backend: { condition: service_healthy } }
    expose: ["80"]

  homecloud-backend:
    build: { context: ., dockerfile: apps/homecloud-backend/Dockerfile }
    restart: unless-stopped
    # Shares homecore's own .env file specifically to get the exact same
    # HOMECORE_INTERNAL_SECRET value on both sides without a second file
    # to keep in sync. A Tier 1 app reading Tier 0's env file directly
    # isn't the cleanest possible separation — a proper shared-secrets
    # convention (e.g. a root-level .env, or a real secrets manager) is
    # worth introducing before this ecosystem is exposed beyond a home
    # LAN; see docs/SECURITY.md.
    env_file: [./homecore/.env]
    environment:
      DATA_DIR: /data
      HOMECORE_INTERNAL_URL: http://homecore:4000
      # Must be set here. homecore/.env (loaded above) contains PORT=4000
      # for HomeCore itself, and without this line this service inherited
      # it and listened on 4000 while its healthcheck, the gateway and its
      # Dockerfile all use 4500, so it never became healthy. Values in
      # `environment:` win over values from `env_file:`.
      PORT: "4500"
    volumes: [homecloud_backend_data:/data]
    expose: ["4500"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4500/api/homecloud/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  homemedia-backend:
    build: { context: ., dockerfile: apps/homemedia-backend/Dockerfile }
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECORE_INTERNAL_URL: http://homecore:4000, HOMECLOUD_BACKEND_INTERNAL_URL: http://homecloud-backend:4500 }
    volumes: [homemedia_data:/data]
    expose: ["4200"]
    depends_on: { homecore: { condition: service_healthy }, homecloud-backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/api/homemedia/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  homemedia:
    build: { context: ., dockerfile: apps/homemedia/Dockerfile }
    restart: unless-stopped
    depends_on: { homemedia-backend: { condition: service_healthy } }
    expose: ["80"]

  homenotes-backend:
    build: { context: ., dockerfile: apps/homenotes-backend/Dockerfile }
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECORE_INTERNAL_URL: http://homecore:4000, HOMECLOUD_BACKEND_INTERNAL_URL: http://homecloud-backend:4500 }
    volumes: [homenotes_data:/data]
    expose: ["4400"]
    depends_on: { homecore: { condition: service_healthy }, homecloud-backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4400/api/homenotes/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # HomeTasks: tasks and projects. It needs HomeCore to verify logins but NOT
  # HomeCloud: tasks are small rows in its own database, there are no files.
  hometasks-backend:
    build: { context: ., dockerfile: apps/hometasks-backend/Dockerfile }
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECORE_INTERNAL_URL: http://homecore:4000 }
    volumes: [hometasks_data:/data]
    expose: ["4700"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4700/api/hometasks/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  hometasks:
    build: { context: ., dockerfile: apps/hometasks/Dockerfile }
    restart: unless-stopped
    depends_on: { hometasks-backend: { condition: service_healthy } }
    expose: ["80"]

  homenotes:
    build: { context: ., dockerfile: apps/homenotes/Dockerfile }
    restart: unless-stopped
    depends_on: { homenotes-backend: { condition: service_healthy } }
    expose: ["80"]

  homesync-backend:
    build: { context: ., dockerfile: apps/homesync-backend/Dockerfile }
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECORE_INTERNAL_URL: http://homecore:4000, HOMECLOUD_BACKEND_INTERNAL_URL: http://homecloud-backend:4500 }
    volumes: [homesync_data:/data]
    expose: ["4300"]
    depends_on: { homecore: { condition: service_healthy }, homecloud-backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4300/api/homesync/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  homevault-backend:
    build: { context: ., dockerfile: apps/homevault-backend/Dockerfile }
    restart: unless-stopped
    # Notice what's NOT here: HOMECLOUD_BACKEND_INTERNAL_URL. HomeVault is
    # the first app with zero dependency on HomeCloud — it stores only its
    # own encrypted blobs, never a real file (see
    # apps/homevault-backend/src/db.js). HomeCore is its only upstream.
    environment: { DATA_DIR: /data, HOMECORE_INTERNAL_URL: http://homecore:4000 }
    volumes: [homevault_data:/data]
    expose: ["4600"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4600/api/homevault/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  homevault:
    build: { context: ., dockerfile: apps/homevault/Dockerfile }
    restart: unless-stopped
    depends_on: { homevault-backend: { condition: service_healthy } }
    expose: ["80"]

  # ---------------------------------------------------------------------
  # Optional: a public HTTPS address (Caddy).
  #
  # Does nothing unless you start it with `--profile public`:
  #   docker compose --profile public up -d
  # A "profile" is Compose's way of saying "only run this service when I
  # explicitly ask", so an ordinary `docker compose up` on a home LAN is
  # completely unchanged. Needs HOME_DOMAIN set in a root .env file and
  # ports 80 + 443 open to the internet — see docs/DEPLOYMENT.md,
  # "A permanent address from anywhere", for the full steps and the security
  # trade-off of leaving the home network.
  # ---------------------------------------------------------------------

  tls:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      # `:-` = empty if unset. (`:?` would make EVERY compose command fail
      # for people who never use this profile, because Compose reads the
      # whole file even for services it isn't starting.)
      HOME_DOMAIN: ${HOME_DOMAIN:-}
    depends_on: [gateway]
    ports:
      - "80:80"      # Let's Encrypt's ownership check + redirect to https
      - "443:443"    # the real thing
      - "443:443/udp" # HTTP/3
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep this volume: if it's wiped, Caddy has to
      # request new certificates, and Let's Encrypt limits how often it will.
      - caddy_data:/data
      - caddy_config:/config

  # ---------------------------------------------------------------------
  # Operational services.
  # ---------------------------------------------------------------------

  backup:
    build: ./services/backup
    restart: unless-stopped
    environment: { BACKUP_INTERVAL_SECONDS: 86400, BACKUP_RETENTION_DAYS: 14 }
    # One read-only source mount per app data volume, each under its own
    # /sources/<name> subdirectory — see services/backup/backup.sh, which
    # loops over every subdirectory it finds here. Adding a future app's
    # backup coverage is one line here, no backup.sh change needed.
    volumes:
      - homecore_data:/sources/homecore:ro
      - homecloud_backend_data:/sources/homecloud-backend:ro
      - homemedia_data:/sources/homemedia:ro
      - homenotes_data:/sources/homenotes:ro
      - homesync_data:/sources/homesync:ro
      - hometasks_data:/sources/hometasks:ro
      - homevault_data:/sources/homevault:ro
      - ./backups:/backups

volumes:
  homecore_data:
  homecloud_backend_data:
  homemedia_data:
  homenotes_data:
  homesync_data:
  hometasks_data:
  homevault_data:
  caddy_data:
  caddy_config:
