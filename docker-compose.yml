# `name:` pins the Docker Compose "project name" to a fixed value.
# Without this, Compose derives the project name from whatever folder this
# file happens to sit in — and every named volume below (homecloud_data,
# homemedia_data, ...) is actually stored internally as
# "<project-name>_<volume-name>". Re-extracting a zip into a folder with a
# different name would silently create BRAND NEW, EMPTY volumes instead of
# reusing your real data — this pin is what makes "the same volume every
# time" actually true. Do not change this value once you have real data;
# changing it has the same effect as renaming the folder.
name: home

services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      homecore: { condition: service_healthy }
    ports: ["8080:80"]

  homecore:
    build: ./homecore
    restart: unless-stopped
    env_file: [./homecore/.env]
    environment:
      DATA_DIR: /data
      HOMECLOUD_FRONTEND_URL: /cloud/
      HOMEMEDIA_FRONTEND_URL: /media/
      HOMESYNC_INFO_URL: /sync/
      HOMENOTES_FRONTEND_URL: /notes/
    volumes: [homecloud_data:/data]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  home:
    build: ./apps/home
    restart: unless-stopped
    depends_on: { homecore: { condition: service_healthy } }
    expose: ["80"]

  homecloud:
    build: ./apps/homecloud
    restart: unless-stopped
    depends_on: { homecore: { condition: service_healthy } }
    expose: ["80"]

  homemedia-backend:
    build: ./apps/homemedia-backend
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECLOUD_INTERNAL_URL: http://homecore:4000 }
    volumes: [homemedia_data:/data]
    expose: ["4200"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/api/homemedia/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  homemedia:
    build: ./apps/homemedia
    restart: unless-stopped
    depends_on: { homemedia-backend: { condition: service_healthy } }
    expose: ["80"]

  homenotes-backend:
    build: ./apps/homenotes-backend
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECLOUD_INTERNAL_URL: http://homecore:4000 }
    volumes: [homenotes_data:/data]
    expose: ["4400"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4400/api/homenotes/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  homenotes:
    build: ./apps/homenotes
    restart: unless-stopped
    depends_on: { homenotes-backend: { condition: service_healthy } }
    expose: ["80"]

  homesync-backend:
    build: ./apps/homesync-backend
    restart: unless-stopped
    environment: { DATA_DIR: /data, HOMECLOUD_INTERNAL_URL: http://homecore:4000 }
    volumes: [homesync_data:/data]
    expose: ["4300"]
    depends_on: { homecore: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4300/api/homesync/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    build: ./services/backup
    restart: unless-stopped
    environment: { BACKUP_INTERVAL_SECONDS: 86400, BACKUP_RETENTION_DAYS: 14 }
    volumes: [homecloud_data:/data:ro, ./backups:/backups]

volumes:
  homecloud_data:
  homemedia_data:
  homenotes_data:
  homesync_data:
