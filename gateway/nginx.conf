events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 80;
    client_max_body_size 0;

    location /api/homemedia/ { proxy_pass http://homemedia-backend:4200; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/homenotes/ { proxy_pass http://homenotes-backend:4400; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/homesync/ { proxy_pass http://homesync-backend:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/homecloud/ { proxy_pass http://homecloud-backend:4500; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    # Deliberately unprefixed and separate from /api/homecloud/ above — a
    # share link is a URL handed to someone with no account at all, and
    # keeping its path short and stable matters more here than API-prefix
    # consistency (see apps/homecloud-backend/src/publicShare.js).
    location /api/share/ { proxy_pass http://homecloud-backend:4500; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/ { proxy_pass http://homecore:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location = /cloud { return 301 /cloud/; }
    location /cloud/ { proxy_pass http://homecloud/; proxy_set_header Host $host; }
    location = /media { return 301 /media/; }
    location /media/ { proxy_pass http://homemedia/; proxy_set_header Host $host; }
    location = /notes { return 301 /notes/; }
    location /notes/ { proxy_pass http://homenotes/; proxy_set_header Host $host; }
    location = /sync { return 301 /sync/; }
    # homesync-backend is a plain Node/Express service (apps/homesync-backend,
    # port 4300) — unlike home/homecloud/homemedia/homenotes it is NOT
    # fronted by its own nginx on port 80, so the port must be explicit
    # here. Its Express app itself serves a static info page at "/" (see
    # apps/homesync-backend/src/app.js) since HomeSync has no real web
    # frontend of its own — the Android app is the actual client.
    location /sync/ { proxy_pass http://homesync-backend:4300/; proxy_set_header Host $host; }
    location / { proxy_pass http://home/; proxy_set_header Host $host; }
  }
}
