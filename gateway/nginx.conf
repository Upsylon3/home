events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # HOW THIS GATEWAY SURVIVES A MISSING APP
  # ---------------------------------------
  # A plain `proxy_pass http://some-app:1234;` makes nginx look up "some-app"
  # ONCE, when nginx starts, and refuse to start at all ("host not found in
  # upstream") if that container isn't running. One stopped app would then take
  # the whole ecosystem down, and "run only HomeCloud" would be impossible.
  #
  # Instead, every location below puts its upstream address in a VARIABLE
  # (`set $up http://...; proxy_pass $up;`). nginx looks a variable's host name up
  # at REQUEST time, through the resolver below, so:
  #   * the gateway starts even if every app is down,
  #   * an app that starts (or restarts with a new address) later is found
  #     within `valid` seconds, with no gateway restart,
  #   * a request for an app that isn't there fails with a 502, which the
  #     error_page rules turn into a friendly "this app is offline" answer.
  #
  # 127.0.0.11 is Docker's built-in DNS server, the one that knows the compose
  # service names. ipv6=off because Docker's DNS answers IPv4 for these names.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    client_max_body_size 0;

    # Give up quickly on an app that doesn't answer, so a person sees the
    # "offline" page within seconds instead of staring at a spinner for the
    # default 60.
    proxy_connect_timeout 5s;

    # Sent to every app (a location that sets its own proxy_set_header would
    # lose these, so none of them do).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # When the GATEWAY can't reach an app (502: refused or not found; 504: no
    # answer in time), answer with JSON by default. Frontend locations below
    # override this with a readable HTML page. These only catch errors nginx
    # makes itself: an app's own 503 (HomeCore's "degraded" health check, for
    # one) is passed through untouched on purpose, since callers read it.
    error_page 502 504 = @offline_json;

    # Every location sets two variables first:
    #   $app  the app's display name, used in the offline message
    #   $up   where to send the request

    # Uploads and playback through HomeMedia need two things the plain
    # one-line rule below doesn't give them. nginx's defaults hold an ENTIRE
    # request body (a whole 1 GB video upload) before passing the first byte
    # on, and an entire response before sending it to the browser — so the
    # upload progress bar would reach 100% and then sit there, and a video
    # couldn't start until it had fully arrived. Turning buffering off makes
    # both stream straight through. The long timeouts are for slow home
    # upload speeds. (More specific paths win over the /api/homemedia/ rule
    # no matter what order they're written in.)
    location /api/homemedia/upload {
      set $app HomeMedia;
      set $up http://homemedia-backend:4200;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /api/homemedia/stream/ {
      set $app HomeMedia;
      set $up http://homemedia-backend:4200;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      # The browser's Range header (what makes seeking in a video work)
      # is forwarded by nginx by default; this comment is here so nobody
      # "tidies" it away by adding a rule that strips it.
    }

    # ---- App backends (the path is passed through unchanged) ----
    location /api/homemedia/ { set $app HomeMedia; set $up http://homemedia-backend:4200; proxy_pass $up; }
    location /api/homenotes/ { set $app HomeNotes; set $up http://homenotes-backend:4400; proxy_pass $up; }
    location /api/hometasks/ { set $app HomeTasks; set $up http://hometasks-backend:4700; proxy_pass $up; }
    location /api/homemonitor/ { set $app HomeMonitor; set $up http://homemonitor-backend:4800; proxy_pass $up; }
    location /api/homesync/ { set $app HomeSync; set $up http://homesync-backend:4300; proxy_pass $up; }
    location /api/homecloud/ { set $app HomeCloud; set $up http://homecloud-backend:4500; proxy_pass $up; }
    location /api/homevault/ { set $app HomeVault; set $up http://homevault-backend:4600; proxy_pass $up; }
    # Deliberately unprefixed and separate from /api/homecloud/ above — a
    # share link is a URL handed to someone with no account at all, and
    # keeping its path short and stable matters more here than API-prefix
    # consistency (see apps/homecloud-backend/src/publicShare.js).
    location /api/share/ { set $app HomeCloud; set $up http://homecloud-backend:4500; proxy_pass $up; }
    # Everything else under /api/ (login, accounts, the app registry) is HomeCore.
    location /api/ { set $app HomeCore; set $up http://homecore:4000; proxy_pass $up; }

    # ---- App frontends ----
    # Each app's own web server sits at the root of its container ("/"), but
    # people reach it at a prefix ("/tasks/"). The old config stripped the prefix
    # with a trailing slash in proxy_pass, which doesn't work with a variable,
    # so the `rewrite` does the same job explicitly: "/tasks/assets/a.js?v=2"
    # becomes "/assets/a.js?v=2" (the query string is kept automatically).
    # `break` means "use the rewritten path right now, don't search for another
    # location".
    location = /cloud { return 301 /cloud/; }
    location /cloud/ { set $app HomeCloud; set $up http://homecloud; error_page 502 504 = @offline_page; rewrite ^/cloud/(.*)$ /$1 break; proxy_pass $up; }
    location = /media { return 301 /media/; }
    location /media/ { set $app HomeMedia; set $up http://homemedia; error_page 502 504 = @offline_page; rewrite ^/media/(.*)$ /$1 break; proxy_pass $up; }
    location = /notes { return 301 /notes/; }
    location /notes/ { set $app HomeNotes; set $up http://homenotes; error_page 502 504 = @offline_page; rewrite ^/notes/(.*)$ /$1 break; proxy_pass $up; }
    location = /monitor { return 301 /monitor/; }
    location /monitor/ { set $app HomeMonitor; set $up http://homemonitor; error_page 502 504 = @offline_page; rewrite ^/monitor/(.*)$ /$1 break; proxy_pass $up; }
    location = /tasks { return 301 /tasks/; }
    location /tasks/ { set $app HomeTasks; set $up http://hometasks; error_page 502 504 = @offline_page; rewrite ^/tasks/(.*)$ /$1 break; proxy_pass $up; }
    location = /vault { return 301 /vault/; }
    location /vault/ { set $app HomeVault; set $up http://homevault; error_page 502 504 = @offline_page; rewrite ^/vault/(.*)$ /$1 break; proxy_pass $up; }
    location = /sync { return 301 /sync/; }
    # homesync-backend is a plain Node/Express service (apps/homesync-backend,
    # port 4300) — unlike home/homecloud/homemedia/homenotes it is NOT
    # fronted by its own nginx on port 80, so the port must be explicit
    # here. Its Express app itself serves a static info page at "/" (see
    # apps/homesync-backend/src/app.js) since HomeSync has no real web
    # frontend of its own — the Android app is the actual client.
    location /sync/ { set $app HomeSync; set $up http://homesync-backend:4300; error_page 502 504 = @offline_page; rewrite ^/sync/(.*)$ /$1 break; proxy_pass $up; }
    # The dashboard itself. Its paths are already the right ones, so no rewrite.
    location / { set $app Home; set $up http://home; error_page 502 504 = @offline_page; proxy_pass $up; }

    # ---- What people see when an app can't be reached ----
    # 503 "Service Unavailable" + Retry-After tells browsers and tools the
    # truth: this is temporary. The words in these strings may not contain a
    # dollar sign except for $app, because nginx fills in every $name.
    location @offline_json {
      default_type application/json;
      add_header Retry-After 10 always;
      add_header Cache-Control "no-store" always;
      return 503 '{"error":"$app is offline right now. It will work again as soon as it starts."}';
    }

    location @offline_page {
      default_type text/html;
      add_header Retry-After 10 always;
      add_header Cache-Control "no-store" always;
      return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>$app is offline</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17120e;color:#f1e6d2;font:16px/1.5 system-ui,sans-serif}main{max-width:30rem;margin:1.5rem;padding:1.5rem 1.75rem;border:2px solid #5a4630;border-radius:6px;background:#221a13}h1{margin:0 0 .5rem;font-size:1.4rem}p{margin:.5rem 0}a{color:#e08a2b}.stripes{height:8px;margin:1.25rem -1.75rem -1.5rem;background:linear-gradient(#f2b84b 0 25%,#e08a2b 25% 50%,#c4572b 50% 75%,#8f2f2f 75%)}@media(prefers-color-scheme:light){body{background:#f3e6cc;color:#2a1d12}main{background:#faf0dc;border-color:#c9b48d}a{color:#a85a10}}</style></head><body><main><h1>$app is offline</h1><p>The rest of Home is working, but this app is not answering right now. It usually comes back by itself within a minute.</p><p><a href="">Try again</a> &middot; <a href="/">Back to Home</a></p><div class="stripes"></div></main></body></html>';
    }
  }
}
