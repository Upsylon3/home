events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 80;
    client_max_body_size 0;

    # Uploads and playback through HomeMedia need two things the plain
    # one-line rule below doesn't give them. nginx's defaults hold an ENTIRE
    # request body (a whole 1 GB video upload) before passing the first byte
    # on, and an entire response before sending it to the browser — so the
    # upload progress bar would reach 100% and then sit there, and a video
    # couldn't start until it had fully arrived. Turning buffering off makes
    # both stream straight through. The long timeouts are for slow home
    # upload speeds. (More specific paths win over the /api/homemedia/ rule
    # no matter what order they're written in.)
    location /api/homemedia/upload {
      proxy_pass http://homemedia-backend:4200;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/homemedia/stream/ {
      proxy_pass http://homemedia-backend:4200;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # The browser's Range header (what makes seeking in a video work)
      # is forwarded by nginx by default; this comment is here so nobody
      # "tidies" it away by adding a rule that strips it.
    }
    location /api/homemedia/ { proxy_pass http://homemedia-backend:4200; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/homenotes/ { proxy_pass http://homenotes-backend:4400; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/hometasks/ { proxy_pass http://hometasks-backend:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/homesync/ { proxy_pass http://homesync-backend:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/homecloud/ { proxy_pass http://homecloud-backend:4500; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/homevault/ { proxy_pass http://homevault-backend:4600; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    # Deliberately unprefixed and separate from /api/homecloud/ above — a
    # share link is a URL handed to someone with no account at all, and
    # keeping its path short and stable matters more here than API-prefix
    # consistency (see apps/homecloud-backend/src/publicShare.js).
    location /api/share/ { proxy_pass http://homecloud-backend:4500; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/ { proxy_pass http://homecore:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    location = /cloud { return 301 /cloud/; }
    location /cloud/ { proxy_pass http://homecloud/; proxy_set_header Host $host; }
    location = /media { return 301 /media/; }
    location /media/ { proxy_pass http://homemedia/; proxy_set_header Host $host; }
    location = /notes { return 301 /notes/; }
    location /notes/ { proxy_pass http://homenotes/; proxy_set_header Host $host; }
    location = /vault { return 301 /vault/; }
    location /vault/ { proxy_pass http://homevault/; proxy_set_header Host $host; }
    location = /sync { return 301 /sync/; }
    # homesync-backend is a plain Node/Express service (apps/homesync-backend,
    # port 4300) — unlike home/homecloud/homemedia/homenotes it is NOT
    # fronted by its own nginx on port 80, so the port must be explicit
    # here. Its Express app itself serves a static info page at "/" (see
    # apps/homesync-backend/src/app.js) since HomeSync has no real web
    # frontend of its own — the Android app is the actual client.
    location /sync/ { proxy_pass http://homesync-backend:4300/; proxy_set_header Host $host; }
    location / { proxy_pass http://home/; proxy_set_header Host $host; }
  }
}
